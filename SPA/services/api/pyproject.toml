[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spa-api"
version = "0.1.0"
description = "SPA 49 business API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "firebase-admin>=6.9,<7",
  "google-cloud-firestore>=2.20,<3",
  "google-cloud-storage>=3.1,<4",
  "httpx>=0.28,<1",
  "pillow>=11.2,<12",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
